services:
  minio:
    image: minio/minio:latest
    container_name: devbrain-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-devbrain}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-devbrain_minio_password}
    ports:
      - "${S3_API_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - devbrain_minio_data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: devbrain-minio-init
    depends_on:
      - minio
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-devbrain}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-devbrain_minio_password}
      S3_BUCKET: ${S3_BUCKET:-devbrain}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do
          sleep 2
        done
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set none "local/$$S3_BUCKET"

volumes:
  devbrain_minio_data:
